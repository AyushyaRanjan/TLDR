[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tldr-everything"
version = "0.1.0"
description = "The Reading Debt Killer: layered summaries of PDFs and long text for small local models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tldr-everything contributors" }]
keywords = ["llm", "pdf", "summarization", "ollama", "qwen", "streamlit", "pymupdf"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = [
    "openai>=1.40",
    "pymupdf>=1.24",
    "streamlit>=1.32",
    "typer>=0.12",
    "pydantic-settings>=2.2",
    "pydantic>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
tldr = "tldr_everything.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/tldr-everything"
Documentation = "https://github.com/your-org/tldr-everything/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tldr_everything/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["tldr_everything"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz", "streamlit", "streamlit.*", "openai", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "slow: live local-model evals; skipped by default and in CI",
]
addopts = "-m 'not slow' --cov=tldr_everything --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/tldr_everything"]
omit = ["src/tldr_everything/ui.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
